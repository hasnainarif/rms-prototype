<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RMS – Interactive UI Prototype v2</title>
<style>
:root{--bg:#0f1420;--card:#1a2233;--card2:#222d42;--txt:#eef2f7;--mut:#9aa7bd;--acc:#2fbf71;--acc2:#3aa0ff;--warn:#f5a623;--danger:#e5604f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#05070c;color:var(--txt);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;display:flex;justify-content:center;min-height:100vh}
.phone{width:100%;max-width:430px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative}
@media(min-width:480px){.phone{border-left:1px solid #1e2a3f;border-right:1px solid #1e2a3f}}
.hdr{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #1e2a3f;position:sticky;top:0;background:var(--bg);z-index:5}
.hdr h1{font-size:18px;margin:0;flex:1}
.back{background:none;border:0;color:var(--txt);font-size:22px;min-width:44px;min-height:44px;cursor:pointer}
.icobtn{background:var(--card);border:1px solid #2b3a55;color:var(--txt);border-radius:12px;min-width:44px;min-height:44px;font-size:20px;cursor:pointer}
.body{flex:1;padding:16px;overflow-y:auto;padding-bottom:90px}
.card{background:var(--card);border:1px solid #24314a;border-radius:14px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#06130c;font-weight:700;font-size:16px;min-height:48px;cursor:pointer;margin-top:10px}
.btn2{background:var(--card2);color:var(--txt);border:1px solid #33415c}
.btnwarn{background:var(--warn);color:#241500}
.link{background:none;border:0;color:var(--acc2);font-size:15px;min-height:44px;cursor:pointer;padding:8px}
input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #33415c;background:#101827;color:var(--txt);font-size:16px;margin-top:6px}
label{font-size:13px;color:var(--mut);display:block;margin-top:12px}
.seg{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;padding:12px;border-radius:10px;border:1px solid #33415c;background:var(--card2);color:var(--txt);font-size:15px;min-height:48px;cursor:pointer}
.seg button.on{background:var(--acc);color:#06130c;border-color:var(--acc);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{padding:10px 14px;border-radius:999px;border:1px solid #33415c;background:var(--card2);font-size:14px;min-height:44px;cursor:pointer}
.chip.on{background:var(--acc2);border-color:var(--acc2);color:#fff;font-weight:700}
.radio{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid #33415c;border-radius:10px;margin-top:8px;cursor:pointer;min-height:48px}
.radio.on{border-color:var(--acc);background:#16281f}
.radio input{width:20px;height:20px;margin:2px 0 0;flex-shrink:0}
.stepdots{display:flex;gap:6px;margin:4px 0 14px}
.stepdots span{flex:1;height:4px;border-radius:2px;background:#2b3a55}
.stepdots span.done{background:var(--acc)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#131b2b;border-top:1px solid #24314a;display:flex;padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
.nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;padding:8px 2px;min-height:56px;cursor:pointer}
.docsec{margin-top:14px}
.doctitle{font-size:15px;font-weight:700;margin-bottom:2px}
.docrow{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #33415c;border-radius:14px;margin-top:8px;cursor:pointer;background:var(--card2);min-height:64px}
.docrow.done{border-color:var(--acc);background:#16281f}
.docico{width:46px;height:46px;min-width:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:23px;background:#31405c}
.docrow.done .docico{background:#1d3a2a}
.docfile{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52vw}
.docup{font-size:13px;font-weight:700;color:var(--acc);border:1.5px solid var(--acc);padding:9px 16px;border-radius:999px;white-space:nowrap}
.docadd{display:flex;gap:8px;align-items:center}
.docadd select{flex:1;margin-top:0;min-height:48px}
.docbtn{width:auto!important;margin-top:0!important;white-space:nowrap;padding:13px 18px;min-height:48px}
.docstat{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #2b3a55;font-size:14px}
.docstat:last-child{border-bottom:0}
.docstat.done .docfile{color:var(--acc)}
.nav button.on{color:var(--acc)}
.nav button .ic{font-size:20px;display:block}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0c2b1a;border:1px solid var(--acc);color:var(--txt);padding:12px 18px;border-radius:12px;font-size:14px;z-index:50;display:none;max-width:90%}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #2b3a55;font-size:14px}
.kv:last-child{border-bottom:0}
.bill{background:#fdfdf8;color:#1a1a1a;border-radius:12px;padding:18px;font-family:Georgia,serif}
.bill h3{margin:0 0 10px;font-size:17px}
.bill .bl{display:flex;justify-content:space-between;padding:5px 0;font-size:15px}
.bill .tot{border-top:2px solid #1a1a1a;margin-top:8px;padding-top:8px;font-weight:700;font-size:17px}
.calc{background:#0e1626;border:1px solid #2b3a55;border-radius:10px;padding:10px;margin-top:10px;font-size:12.5px;color:var(--mut)}
.calc b{color:var(--txt)}
.stepper{display:flex;align-items:center;gap:12px;margin-top:8px}
.stepper button{width:48px;height:48px;border-radius:12px;border:1px solid #33415c;background:var(--card2);color:var(--txt);font-size:22px;cursor:pointer}
.stepper .val{font-size:20px;min-width:40px;text-align:center;font-weight:700}
.meterbox{border:1px solid #33415c;border-radius:12px;padding:12px;margin-top:10px;background:#141d30}
.hrow{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #24314a;border-radius:12px;margin-bottom:10px;background:var(--card);cursor:pointer;min-height:64px}
.dp{width:46px;height:46px;border-radius:50%;background:var(--acc2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff;flex-shrink:0}
.st{font-size:12px;padding:4px 10px;border-radius:999px}
.paid{background:#0f2f1e;color:#4ade80}.due{background:#3a1d12;color:#f5a623}
.tabrow{display:flex;gap:8px;margin-bottom:12px}
.tabrow button{flex:1;padding:12px;border-radius:10px;border:1px solid #33415c;background:var(--card2);color:var(--mut);min-height:48px;font-size:15px;cursor:pointer}
.tabrow button.on{background:var(--acc);color:#06130c;font-weight:700}
.empty{text-align:center;padding:48px 20px;color:var(--mut)}
.bigreg{font-size:18px;padding:18px;min-height:60px}
.formula{background:#101a2e;border-left:3px solid var(--acc2);padding:8px 10px;font-size:12.5px;color:var(--mut);margin-top:6px;border-radius:0 8px 8px 0}
h2.stitle{font-size:16px;margin:0 0 4px}
.note{background:#0e1a2e;border:1px solid var(--acc2);border-radius:10px;padding:10px;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="phone">
  <div id="app"></div>
  <div class="toast" id="toast"></div>
</div>
<script>
/* ============ RMS Prototype v2 — blank-first, rebuilt per Hasnain's review ============ */
const S = {
  screen:'login', tab:'home',
  lang:'en',
  prop:null, houses:[], bills:{}, past:[], _prSt:'paid',
  wz:{step:1}, collTab:'bld', collMonth:'Sep 2026',
  lastSync:null, seq:1
};
const L = {
en:{app:'RMS',home:'Properties',houses:'Houses',coll:'Collection',set:'Settings',reg:'Register a Property',skip:'Skip for now',login:'Log in',signup:'Sign up',forgot:'Forgot password?',noProp:'No properties yet',noPropSub:'Register your first property to get started.',create:'Create account',have:'Already have an account? Log in',need:'Need an account? Sign up'},
ur:{app:'آر ایم ایس',home:'پراپرٹیز',houses:'مکانات',coll:'وصولی',set:'سیٹنگز',reg:'پراپرٹی رجسٹر کریں',skip:'ابھی چھوڑیں',login:'لاگ اِن',signup:'سائن اپ',forgot:'پاس ورڈ بھول گئے؟',noProp:'ابھی کوئی پراپرٹی نہیں',noPropSub:'شروع کرنے کے لیے اپنی پہلی پراپرٹی رجسٹر کریں۔',create:'اکاؤنٹ بنائیں',have:'پہلے سے اکاؤنٹ ہے؟ لاگ اِن کریں',need:'اکاؤنٹ چاہیے؟ سائن اپ کریں'}};
const T = k => (L[S.lang]&&L[S.lang][k])||L.en[k]||k;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2600);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function go(sc,param){S.screen=sc;S._p=param;render();window.scrollTo(0,0);}
function tab(t){S.tab=t;S.screen='main';render();window.scrollTo(0,0);}
const $=id=>document.getElementById(id);

/* ---------- LOGIN / SIGNUP (forms, not straight into app) ---------- */
function vLogin(){return `<div class="body" style="display:flex;flex-direction:column;justify-content:center">
<div style="text-align:center;margin-bottom:26px"><div style="font-size:52px">🏠</div><h1 style="margin:8px 0 2px">RMS</h1><div class="mut">Renter Management System</div></div>
<div class="card"><label>Phone number</label><input id="li_ph" inputmode="tel" placeholder="03xx xxxxxxx">
<label>Password</label><input id="li_pw" type="password" placeholder="••••••••">
<button class="btn" onclick="doLogin()">${T('login')}</button>
<div style="text-align:center"><button class="link" onclick="toast('Password reset link sent to your phone')">🔑 ${T('forgot')}</button></div></div>
<div style="text-align:center;margin-top:6px"><button class="link" onclick="go('signup')">${T('need')}</button><br>
<button class="link" onclick="enterApp()" style="color:var(--mut)">${T('skip')} →</button></div></div>`;}
function doLogin(){if(!$('li_ph').value.trim()){toast('Please enter phone number');return;}if(!$('li_pw').value){toast('Please enter password');return;}enterApp();}
function vSignup(){return `<div class="body" style="display:flex;flex-direction:column;justify-content:center">
<div style="text-align:center;margin-bottom:20px"><div style="font-size:46px">📝</div><h1 style="margin:8px 0 2px">${T('signup')}</h1></div>
<div class="card"><label>Full name</label><input id="su_nm" placeholder="Your name">
<label>Phone number</label><input id="su_ph" inputmode="tel" placeholder="03xx xxxxxxx">
<label>Password</label><input id="su_pw" type="password" placeholder="Choose a password">
<button class="btn" onclick="doSignup()">${T('create')}</button></div>
<div style="text-align:center"><button class="link" onclick="go('login')">← ${T('have')}</button></div></div>`;}
function doSignup(){if(!$('su_nm').value.trim()||!$('su_ph').value.trim()){toast('Please fill name and phone');return;}toast('Account created. Welcome!');enterApp();}
function enterApp(){S.screen='main';S.tab='home';render();}

/* ---------- MAIN SHELL ---------- */
function shell(inner){
  const nav=[['home','🏢',T('home')],['houses','🚪',T('houses')],['coll','🧾',T('coll')],['set','⚙️',T('set')]];
  return `<div class="hdr"><h1>${T('app')}</h1></div>
  <div class="body">${inner}</div>
  <div class="nav">${nav.map(n=>`<button class="${S.tab===n[0]?'on':''}" onclick="tab('${n[0]}')"><span class="ic">${n[1]}</span>${n[2]}</button>`).join('')}</div>`;
}

/* ---------- HOME (blank-first: Register + Settings, no pre-filled data) ---------- */
function vHome(){
  if(!S.prop) return shell(`<div class="empty"><div style="font-size:56px">🏘️</div>
    <h2>${T('noProp')}</h2><p>${T('noPropSub')}</p>
    <button class="btn bigreg" onclick="startWz()">＋ ${T('reg')}</button></div>`);
  const p=S.prop, n=S.houses.length, due=S.houses.filter(h=>h.status!=='paid').length;
  return shell(`<div class="card"><div class="row"><div class="grow"><h2 class="stitle">🏢 ${esc(p.name)}</h2>
  <div class="mut">${esc(p.type)} · ${p.floors} floor(s) · ${n} house(s)</div>
  <div class="kv" style="margin-top:8px"><span>Outstanding this month</span><b>${due} house(s) due</b></div></div></div>
  <button class="btn btn2" onclick="tab('houses')">Open →</button></div>
  <button class="btn btn2" onclick="startWz()">＋ ${T('reg')} (another)</button>`);
}
</script>
</body>
</html>
<script>
/* ================= REGISTRATION WIZARD (9 steps, English labels) ================= */
function startWz(){S.wz={step:1,type:'Apartment',name:'',floors:2,floorHouses:[],houseMeters:[],keMeters:[{no:'',houses:[]}],gasMeters:[{no:'',houses:[]}],motorMeter:{no:'',type:'none'},charges:{sec:{mode:'none',amt:'',method:'equal'},water:{mode:'none',amt:'',method:'equal'},maint:{mode:'none',amt:'',method:'equal'},motor:{mode:'none',amt:'',method:'equal'}},eRule:'submeter',gRule:'submeter',nameStyle:'num',namePrefix:'',nameAuto:true};go('wizard');}
function wzDots(n,cur){let s='<div class="stepdots">';for(let i=1;i<=n;i++)s+=`<span class="${i<=cur?'done':''}"></span>`;return s+'</div>';}
function wzBar(title,step){return `<div class="hdr"><button class="back" onclick="wzBack()">←</button><h1>${title}</h1><div class="mut">Step ${step}/9</div></div>`;}
function wzBack(){if(S.wz.step>1){S.wz.step--;go('wizard');}else{tab('home');}}
function wzNext(){
  const w=S.wz;
  if(w.step===2&&!w.name.trim()){toast('Please enter property name');return;}
  if(w.step===4){for(let f=0;f<=w.floors;f++){const fh=w.floorHouses[f]||{n:1,names:[]};if(!fh.n||fh.n<1){toast(flLbl(f)+': set number of houses');return;}}}
  if(w.step<9){w.step++;go('wizard');}else finishWz();
}
function wzNextBtn(lbl){return `<button class="btn" onclick="wzNext()">${lbl||'Next →'}</button>`;}
function flLbl(f){return f===0?'Ground (G)':'Floor '+f;}
function flShort(f){return f===0?'G':'F'+f;}
function flatHouses(){const w=S.wz,out=[];for(let f=0;f<=w.floors;f++){const fh=w.floorHouses[f]||(w.floorHouses[f]={n:1,names:[]});const n=fh.n||1;fh.names=fh.names||[];for(let i=0;i<n;i++){if(!fh.names[i])fh.names[i]=autoName(f,i);out.push({floor:f,idx:i,code:fh.names[i],key:f+'-'+i});}}return out;}
function autoName(f,i){const nn=String(i+1).padStart(2,'0'),w=S.wz,st=w.nameStyle||'num';
  if(f===0)return 'G-'+nn;
  if(st==='alpha')return 'ABCDEFGHIJ'[f-1]+'-'+nn;
  if(st==='custom'){const px=(w.namePrefix||'').trim()||'Unit';return px+'-'+f+nn;}
  return f+''+nn;}
function applyAutoNames(){const w=S.wz;for(let f=0;f<=w.floors;f++){const fh=w.floorHouses[f]||(w.floorHouses[f]={n:1,names:[],owners:[]});const n=fh.n||1;fh.names=[];for(let i=0;i<n;i++)fh.names[i]=autoName(f,i);}w.nameAuto=true;}
function syncFloors(){const w=S.wz;for(let f=0;f<=w.floors;f++){w.floorHouses[f]=w.floorHouses[f]||{n:1,names:[],owners:[]};}w.floorHouses.length=w.floors+1;if(w.nameAuto!==false)applyAutoNames();}
function setNameStyle(st){S.wz.nameStyle=st;applyAutoNames();render();}

function vWizard(){const w=S.wz;
  let inner='';
  if(w.step===1){inner=`${wzDots(9,1)}<h2 class="stitle">Property type</h2><div class="mut">What kind of property is this?</div>
  <div class="seg">${['Apartment','Shop','Other'].map(t=>`<button class="${w.type===t?'on':''}" onclick="S.wz.type='${t}';render()">${t}</button>`).join('')}</div>`;}
  if(w.step===2){inner=`${wzDots(9,2)}<h2 class="stitle">Property name</h2><div class="mut">e.g. My Villa</div>
  <label>Property name</label><input id="w_name" value="${esc(w.name)}" placeholder="My Villa" oninput="S.wz.name=this.value">`;}
  if(w.step===3){inner=`${wzDots(9,3)}<h2 class="stitle">Floors</h2><div class="mut">How many floors are <b>above the ground floor</b>? The ground floor (G) is always included.<br>Example: <b>3</b> means Ground + 3 upper floors.</div>
  <div class="stepper"><button onclick="S.wz.floors=Math.max(0,S.wz.floors-1);syncFloors();render()">−</button><div class="val">${w.floors}</div><button onclick="S.wz.floors=Math.min(10,S.wz.floors+1);syncFloors();render()">＋</button></div>
  <div class="note">Total floors: <b>Ground + ${w.floors}</b> = ${w.floors+1}</div>`;}
  if(w.step===4){syncFloors();const w4=S.wz;let h='';
    const prevC=((w4.namePrefix||'').trim()||'Unit');
    h+=`<div class="card"><b>🏷️ House naming style</b><div class="mut">Pick once — the app names every house automatically. You can still edit any name below.</div>
    <div class="radio ${w4.nameStyle==='num'?'on':''}" onclick="setNameStyle('num')"><input type="radio" ${w4.nameStyle==='num'?'checked':''}><div><b>101 style</b><div class="formula">G-01, G-02 · 101, 102 · 201, 202…</div></div></div>
    <div class="radio ${w4.nameStyle==='alpha'?'on':''}" onclick="setNameStyle('alpha')"><input type="radio" ${w4.nameStyle==='alpha'?'checked':''}><div><b>A-01 style</b><div class="formula">G-01, G-02 · A-01, A-02 · B-01…</div></div></div>
    <div class="radio ${w4.nameStyle==='custom'?'on':''}" onclick="setNameStyle('custom')"><input type="radio" ${w4.nameStyle==='custom'?'checked':''}><div><b>Custom prefix</b><div class="formula">${esc(prevC)}-101, ${esc(prevC)}-102…</div></div></div>
    ${w4.nameStyle==='custom'?`<label>Your prefix (e.g. Shop, Flat, Office)</label><input value="${esc(w4.namePrefix)}" placeholder="Shop" oninput="S.wz.namePrefix=this.value" onchange="applyAutoNames();render()">`:''}
    ${w4.nameAuto===false?`<button class="btn btn2" onclick="applyAutoNames();render()">↺ Auto-generate all names</button>`:''}</div>`;
    for(let f=0;f<=w4.floors;f++){const fh=w4.floorHouses[f];const n=fh.n||1;
    h+=`<div class="card"><div class="row"><div class="grow"><b>${flLbl(f)}</b><div class="mut">Houses on this floor</div></div>
    <div class="stepper"><button onclick="wzFloorN(${f},-1)">−</button><div class="val">${n}</div><button onclick="wzFloorN(${f},1)">＋</button></div></div>`;
    for(let i=0;i<n;i++){const ow=(fh.owners||[])[i];h+=`<label>House ${i+1} name (auto-filled, editable)</label><input value="${esc(fh.names[i]||'')}" placeholder="${autoName(f,i)}" oninput="S.wz.floorHouses[${f}].names[${i}]=this.value" onchange="S.wz.nameAuto=false;render()">
    <button class="chip ${ow?'on':''}" style="margin-top:6px" onclick="wzOwner(${f},${i})">🏠 Owner lives here${ow?' ✓':''}</button>`;}
    h+='</div>';}
    inner=`${wzDots(9,4)}<h2 class="stitle">Houses per floor</h2><div class="mut">Ground floor (G) first, then Floor 1, 2, … — just tell us <b>how many houses</b> are on each floor. If <b>you (the owner)</b> live in a house, mark it — it will be excluded from bills.</div>`+h;}
  if(w.step===5){const hs=flatHouses();let h='';
    hs.forEach((hh,i)=>{const m=w.houseMeters[i]||(w.houseMeters[i]={e:false,g:false,wt:false,eNo:'',gNo:'',wNo:''});
    h+=`<div class="card"><b>${esc(hh.code||autoName(hh.floor,hh.idx))}</b>
    <label>Electricity sub-meter installed?</label><div class="seg"><button class="${m.e?'on':''}" onclick="S.wz.houseMeters[${i}].e=true;render()">Yes</button><button class="${!m.e?'on':''}" onclick="S.wz.houseMeters[${i}].e=false;render()">No</button></div>
    ${m.e?`<label>Printed sub-meter number (serial on the meter)</label><input value="${esc(m.eNo)}" placeholder="e.g. SN-45218" oninput="S.wz.houseMeters[${i}].eNo=this.value">`:''}
    <label>Gas sub-meter installed?</label><div class="seg"><button class="${m.g?'on':''}" onclick="S.wz.houseMeters[${i}].g=true;render()">Yes</button><button class="${!m.g?'on':''}" onclick="S.wz.houseMeters[${i}].g=false;render()">No</button></div>
    ${m.g?`<label>Printed sub-meter number (serial on the meter)</label><input value="${esc(m.gNo)}" placeholder="e.g. SN-77120" oninput="S.wz.houseMeters[${i}].gNo=this.value">`:''}
    <label>Water sub-meter installed?</label><div class="seg"><button class="${m.wt?'on':''}" onclick="S.wz.houseMeters[${i}].wt=true;render()">Yes</button><button class="${!m.wt?'on':''}" onclick="S.wz.houseMeters[${i}].wt=false;render()">No</button></div>

    inner=`${wzDots(9,5)}<h2 class="stitle">Sub-meters per house</h2><div class="mut">For every house: does it have its own sub-meter? Enter the printed serial number from the meter.</div>`+h;}
  if(w.step===6){const hs=flatHouses();
    const meterSec=(title,key,ph)=>{let h=`<div class="card"><h2 class="stitle">${title}</h2><div class="mut">Add as many as installed. For each meter, select which house(s) it serves.</div>`;
    w[key].forEach((m,mi)=>{h+=`<div class="meterbox"><div class="row"><div class="grow"><label style="margin-top:0">Meter ${mi+1} number</label></div>${w[key].length>1?`<button class="icobtn" onclick="wzMeterDel('${key}',${mi})">✕</button>`:''}</div>
      <input value="${esc(m.no)}" placeholder="${ph}" oninput="S.wz['${key}'][${mi}].no=this.value">
      <label>Which house(s) does this meter serve? (tap all that share it)</label><div class="chips">
      ${hs.map((hh,hi)=>`<button class="chip ${m.houses.includes(hi)?'on':''}" onclick="wzMeterShare('${key}',${mi},${hi})">${esc(hh.code||(flShort(hh.floor)+(hh.idx+1)))}</button>`).join('')}</div></div>`;});
    h+=`<button class="btn btn2" onclick="S.wz['${key}'].push({no:'',houses:[]});render()">＋ Add another meter</button></div>`;return h;};
    inner=`${wzDots(9,6)}<h2 class="stitle">Official meters</h2>`+meterSec('⚡ KE account numbers','keMeters','e.g. 040012345678')+meterSec('🔥 SSGC customer numbers','gasMeters','e.g. 1234567890');}
  if(w.step===7){const CH=[['sec','Security charges'],['water','Water charges'],['maint','Maintenance'],['motor','Motor / common']];
    const VM={sec:[['equal','Split equally per house','Total ÷ number of houses. Every house pays the same.'],['person','Per person (resident count)','Total ÷ all residents × this house\u2019s residents.']],
      water:[['equal','Split equally per house','Total ÷ number of houses. Every house pays the same.'],['person','Per person (resident count)','Total ÷ all residents × this house\u2019s residents.'],['submeter','By water sub-meter reading','Each house pays in proportion to its water meter units: total × (house units ÷ all units).']],

    inner=`${wzDots(9,7)}<h2 class="stitle">Fixed / variable charges</h2><div class="mut">For each charge choose: none, a fixed monthly amount, or variable.</div>`+
    CH.map(([k,nm])=>{const c=w.charges[k];
    return `<div class="card"><b>${nm}</b><div class="seg">${['none','fixed','variable'].map(m=>`<button class="${c.mode===m?'on':''}" onclick="S.wz.charges.${k}.mode='${m}';render()">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div>
    ${c.mode==='fixed'?`<label>Fixed monthly amount (Rs)</label><input type="number" inputmode="numeric" value="${esc(c.amt)}" placeholder="e.g. 500" oninput="S.wz.charges.${k}.amt=this.value">`:''}
    ${c.mode==='variable'?`<label>If variable, how should the app calculate each house's share?</label>

      <div class="radio ${c.method===m?'on':''}" onclick="S.wz.charges.${k}.method='${m}';render()"><input type="radio" ${c.method===m?'checked':''}><div><b>${t}</b><div class="formula">${f}</div></div></div>`).join('')}`:''}</div>`;}).join('')
    +(w.charges.motor.mode!=='none'?`<div class="card"><b>🔌 Motor meter</b><div class="mut">Does the motor have its own meter? If yes, enter it.</div>

      ${w.motorMeter.type!=='none'?`<label>Motor meter number</label><input value="${esc(w.motorMeter.no)}" placeholder="${w.motorMeter.type==='ke'?'e.g. 040012345678':'e.g. SN-90210'}" oninput="S.wz.motorMeter.no=this.value">`:''}</div>`:`

  if(w.step===8){const ruleRow=(lbl,key)=>`<div class="card"><b>${lbl}</b>
    ${[['equal','Split equally per house'],['submeter','By sub-meter reading'],['person','Per person (resident count)']].map(([m,t])=>`
    <div class="radio ${w[key]===m?'on':''}" onclick="S.wz.${key}='${m}';render()"><input type="radio" ${w[key]===m?'checked':''}><div><b>${t}</b></div></div>`).join('')}</div>`;
    inner=`${wzDots(9,8)}<h2 class="stitle">Bill split rules</h2>

    +ruleRow('⚡ Electricity bill split','eRule')+ruleRow('🔥 Gas bill split','gRule');}
  if(w.step===9){const hs=flatHouses();
    inner=`${wzDots(9,9)}<h2 class="stitle">Review</h2><div class="card">
    <div class="kv"><span>Type</span><b>${esc(w.type)}</b></div>
    <div class="kv"><span>Name</span><b>${esc(w.name)}</b></div>
    <div class="kv"><span>Floors</span><b>Ground + ${w.floors}</b></div>

    <div class="kv"><span>Motor meter</span><b>${esc(w.motorMeter.no||'—')}</b></div></div>
    <div class="mut">Houses: ${hs.map(h=>esc(h.code||(flShort(h.floor)+(h.idx+1)))).join(', ')}</div>`;}
  return `${wzBar('Register Property',w.step)}<div class="body">${inner}${wzNextBtn(w.step===9?'✓ Finish & Create Property':null)}</div>`;
}
function wzFloorN(f,d){const w=S.wz;const fh=w.floorHouses[f]||(w.floorHouses[f]={n:1,names:[],owners:[]});fh.n=Math.min(8,Math.max(1,(fh.n||1)+d));if(w.nameAuto!==false){fh.names=[];for(let i=0;i<fh.n;i++)fh.names[i]=autoName(f,i);}render();}
function wzOwner(f,i){const fh=S.wz.floorHouses[f];fh.owners=fh.owners||[];fh.owners[i]=!fh.owners[i];render();}
function wzMeterDel(key,mi){S.wz[key].splice(mi,1);render();}
function wzMeterShare(key,mi,hi){const a=S.wz[key][mi].houses;const i=a.indexOf(hi);if(i>=0)a.splice(i,1);else a.push(hi);render();}
function finishWz(){const w=S.wz,hs=flatHouses();
  S.prop={name:w.name,type:w.type,floors:w.floors,keMeters:w.keMeters.filter(m=>m.no),gasMeters:w.gasMeters.filter(m=>m.no),motorMeter:w.motorMeter,charges:w.charges,eRule:w.eRule,gRule:w.gRule};
  S.houses=hs.map((h,i)=>{const m=w.houseMeters[i]||{};const ow=((w.floorHouses[h.floor]||{}).owners||[])[h.idx];
  return{id:'h'+(++S.seq),code:h.code||((w.name||'P')+'-'+flShort(h.floor)+(h.idx+1)),floor:h.floor,tenant:'',residents:0,rent:0,advance:0,priorDues:0,prevExtra:0,subE:m.eNo||'',subG:m.gNo||'',subW:m.wNo||'',prevE:0,prevG:0,prevW:0,curW:'',owner:!!ow,status:'due'};});
  toast('Property "'+w.name+'" registered');tab('home');}
</script>
<script>
/* ================= HOUSES (＋ works) ================= */
function vHouses(){
  if(!S.prop) return shell(`<div class="empty"><div style="font-size:52px">🏢</div><p>Register a property first.</p><button class="btn" onclick="startWz()">＋ ${T('reg')}</button></div>`);

    <div class="grow"><b>${esc(h.tenant||'(vacant)')}</b><div class="mut">${esc(h.code)} · ${flLbl(h.floor)} · ${h.residents} person(s)</div></div>
    <span class="st ${h.owner?'paid':h.status==='paid'?'paid':'due'}">${h.owner?'Owner':h.status==='paid'?'Paid':'Due'}</span></div>`).join('');

}
function addHouseForm(){$('addh').innerHTML=`<div class="card"><b>Add house</b>
  <label>House code</label><input id="ah_code" placeholder="e.g. ${esc(S.prop.name)}-A">
  <label>Tenant name</label><input id="ah_tenant" placeholder="e.g. Ahmed Khan">
  <label>Residents (person count)</label><input id="ah_res" type="number" inputmode="numeric" placeholder="0">
  <label style="display:flex;gap:10px;align-items:center;cursor:pointer"><input type="checkbox" id="ah_owner" style="width:24px;height:24px;margin:0"> <span>Owner lives here (no bill)</span></label>
  <div class="row"><button class="btn btn2 grow" onclick="$('addh').innerHTML=''">Cancel</button><button class="btn grow" onclick="addHouse()">Add</button></div></div>`;}
function addHouse(){const code=$('ah_code').value.trim()||('H'+(S.houses.length+1));
  S.houses.push({id:'h'+(++S.seq),code,floor:1,tenant:$('ah_tenant').value.trim(),residents:+$('ah_res').value||0,rent:0,advance:0,priorDues:0,prevExtra:0,subE:'',subG:'',subW:'',prevE:0,prevG:0,prevW:0,curE:'',curG:'',curW:'',owner:$('ah_owner').checked,status:'due'});
  toast('House '+code+' added');tab('houses');}
const H=id=>S.houses.find(h=>h.id===id);

/* ================= MONTHLY HOUSE SHEET ================= */
function vSheet(id){const h=H(id);if(!h)return shell('<p>House not found</p>');
  const p=S.prop;
  const meterRow=(lbl,sub,prev,cur,ph,kind)=>sub?`<div class="card"><b>${lbl}</b><div class="mut">Sub-meter: ${esc(sub)} · Last: ${prev}</div>
  <label>Current reading</label><input id="${ph}" type="number" inputmode="numeric" value="${esc(cur)}" placeholder="Enter reading">
  ${fileBtn(h.id,kind,'📷 Attach meter photo')}
  ${fileChips(h,kind)}</div>`:'';
  const CNM={sec:'Security',water:'Water',maint:'Maintenance',motor:'Motor'};
  const varCharge=k=>p.charges[k].mode==='variable'?`<label>Total ${CNM[k]} bill this month (Rs) — will split ${p.charges[k].method}</label><input id="vt_${k}" type="number" inputmode="numeric" placeholder="e.g. 3000">`:'';
  return `${sheetBar('Monthly Sheet · '+h.code+(h.owner?' · Owner':''))}<div class="body">
  <div class="card"><div class="row"><div class="dp">${esc((h.tenant||h.code)[0].toUpperCase())}</div>
  <div class="grow"><label style="margin-top:0">Tenant name</label><input id="sh_tenant" value="${esc(h.tenant)}" oninput="H('${h.id}').tenant=this.value" style="margin-top:2px"></div></div>
  <div class="row"><div class="grow"><label>Residents</label><input id="sh_res" type="number" value="${h.residents}" oninput="H('${h.id}').residents=+this.value||0"></div>
  <div class="grow"><label>Rent (Rs)</label><input id="sh_rent" type="number" value="${h.rent}" oninput="H('${h.id}').rent=+this.value||0;updTotal('${h.id}')"></div></div>
  <div class="row"><div class="grow"><label>Lease advance</label><input type="number" value="${h.advance}" oninput="H('${h.id}').advance=+this.value||0;updTotal('${h.id}')"></div>
  <div class="grow"><label>Prior dues (Rs)</label><input type="number" value="${h.priorDues}" oninput="H('${h.id}').priorDues=+this.value||0;updTotal('${h.id}')"></div></div>
  <label>Previous extra / credit (Rs) — negative = credit, e.g. -368</label><input type="number" value="${h.prevExtra}" oninput="H('${h.id}').prevExtra=+this.value||0;updTotal('${h.id}')">
  <div class="docsec"><div class="doctitle">📁 Documents</div><div class="mut" style="margin:-2px 0 6px">Pick a document type, then attach its photo or PDF.</div>
  <div class="docadd"><select id="dt_${h.id}">${DOCS.map(([k,ic,lbl])=>`<option value="${k}">${ic} ${lbl}</option>`).join('')}</select><button class="btn docbtn" onclick="document.getElementById('df_${h.id}').click()">📎 Attach</button></div>
  <input type="file" id="df_${h.id}" style="display:none" accept="image/*,.pdf" onchange="attachFile('${h.id}',document.getElementById('dt_${h.id}').value,this)">
  ${DOCS.map(([k,ic,lbl])=>{const f=h.files&&h.files[k];return `<div class="docstat ${f?'done':''}"><span>${ic} <b>${lbl}</b></span><span class="mut docfile">${f?'✓ '+esc(f.name):'— not attached'}</span>${f?`<button class="icobtn" onclick="docDel('${h.id}','${k}')">✕</button>`:''}</div>`;}).join('')}</div>
  <label style="margin-top:10px">This month's total (Rs) — auto-calculated, you can edit</label><input id="m_total" type="number" value="${(h.rent||0)+(h.priorDues||0)+(h.prevExtra||0)}">
  <div class="formula">= Rent + Prior dues + Prev extra · updates as you type above · advance tracked separately</div></div>
  ${h.owner?'<div class="note">🏠 Owner-occupied house — no bill is generated for this house, and it is excluded from splits.</div>':''}
  ${meterRow('⚡ Electricity',h.subE,h.prevE,h.curE,'curE','meterE')}
  ${meterRow('🔥 Gas',h.subG,h.prevG,h.curG,'curG','meterG')}
  ${meterRow('💧 Water',h.subW,h.prevW,h.curW,'curW','meterW')}
  <div class="card"><h2 class="stitle">This month's totals</h2>
  <label>Total KE bill (Rs)</label><input id="t_ke" type="number" inputmode="numeric" placeholder="e.g. 5000">
  <label>Total gas bill (Rs)</label><input id="t_gas" type="number" inputmode="numeric" placeholder="e.g. 2000">
  ${['sec','water','maint','motor'].map(varCharge).join('')}
  <div class="note">📌 Split rules saved for ${esc(p.name)}: electricity = <b>${p.eRule}</b>, gas = <b>${p.gRule}</b>. They apply automatically below.</div></div>
  <button class="btn" onclick="genBill('${h.id}')">🧾 Generate Bill</button>
  <button class="btn btn2" onclick="tab('houses')">← Back to houses</button></div>`;
}
const DOCS=[['agreement','📄','Agreement'],['cnic','🪪','CNIC'],['jobcard','🧰','Job Card']];
function docDel(hid,kind){const h=H(hid);if(h.files)delete h.files[kind];render();}
function attachFile(hid,kind,input){const h=H(hid);const f=input.files&&input.files[0];if(!f)return;h.files=h.files||{};h.files[kind]={name:f.name,url:URL.createObjectURL(f)};toast('📎 '+f.name+' attached');render();}
function fileChips(h,kind){const f=h.files&&h.files[kind];if(!f)return '';return `<div class="chips"><span class="chip on">📎 ${esc(f.name)}</span></div>`;}
function updTotal(hid){const h=H(hid);const el=$('m_total');if(el)el.value=(+h.rent||0)+(+h.priorDues||0)+(+h.prevExtra||0);}
function sheetBar(t){return `<div class="hdr"><button class="back" onclick="tab('houses')">←</button><h1 style="font-size:15px">${esc(t)}</h1></div>`;}

/* ---------- Bill engine: applies saved split rules ---------- */
function share(total,rule,h,hs,units,sumU,totRes,nb){
  if(!(total>0))return 0;
  if(rule==='equal'||nb===0)return total/nb;
  if(rule==='person')return totRes>0?total*(+h.residents||0)/totRes:total/nb;
  if(rule==='submeter')return sumU>0?total*units/sumU:total/nb;
  return total/nb;
}
function genBill(id){const h=H(id),p=S.prop,hs=S.houses;
  if(h.owner){toast('Owner-occupied house — no bill needed');return;}
  h.curE=$('curE')?+$('curE').value||0:h.curE; h.curG=$('curG')?+$('curG').value||0:h.curG; h.curW=$('curW')?+$('curW').value||0:h.curW;
  const keTot=+$('t_ke').value||0, gasTot=+$('t_gas').value||0;
  const nb=hs.filter(x=>!x.owner).length||1;
  const units=hs.map(x=>x.owner?0:Math.max(0,(+x.curE||0)-(+x.prevE||0)));
  const gunits=hs.map(x=>x.owner?0:Math.max(0,(+x.curG||0)-(+x.prevG||0)));
  const wunits=hs.map(x=>x.owner?0:Math.max(0,(+x.curW||0)-(+x.prevW||0)));
  const sumU=units.reduce((a,b)=>a+b,0), sumGU=gunits.reduce((a,b)=>a+b,0), sumWU=wunits.reduce((a,b)=>a+b,0), totRes=hs.reduce((a,x)=>a+(x.owner?0:(+x.residents||0)),0);
  const ui=hs.indexOf(h);
  const eShare=share(keTot,p.eRule,h,hs,units[ui],sumU,totRes,nb);
  const gShare=share(gasTot,p.gRule,h,hs,gunits[ui],sumGU,totRes,nb);
  const lines=[],calc=[];
  if(h.rent>0)lines.push(['Rent',h.rent]);
  if(keTot>0){lines.push(['KE bill',Math.round(eShare)]);calc.push(`<b>⚡ KE Rs ${keTot}</b> split <b>${p.eRule}</b> → Rs ${Math.round(eShare)}`);}
  if(gasTot>0){lines.push(['Gas bill',Math.round(gShare)]);calc.push(`<b>🔥 Gas Rs ${gasTot}</b> split <b>${p.gRule}</b> → Rs ${Math.round(gShare)}`);}
  const CN={sec:'Security',water:'Water',maint:'Maintenance',motor:'Motor'};
  for(const k of['sec','water','maint','motor']){const c=p.charges[k];let amt=0,how='';
    if(c.mode==='fixed'){amt=+c.amt||0;how='fixed Rs '+amt;}
    else if(c.mode==='variable'){const t=+$('vt_'+k).value||0;
      if(c.method==='equal'){amt=t/nb;how=`variable Rs ${t} ÷ ${nb} house(s)`;}
      else if(c.method==='person'){amt=totRes>0?t*(+h.residents||0)/totRes:0;how=`variable Rs ${t} × ${h.residents}/${totRes} persons`;}
      else if(k==='water'){amt=sumWU>0?t*wunits[ui]/sumWU:0;how=`variable Rs ${t} × ${wunits[ui]}/${sumWU} water units`};}
    if(amt>0){lines.push([CN[k]+(c.mode==='variable'?' (variable)':''),Math.round(amt)]);calc.push(`<b>${CN[k]} Rs ${Math.round(amt)}</b> — ${how} (saved rule)`);}}
  if(h.priorDues>0)lines.push(['Prior dues',h.priorDues]);
  if(h.prevExtra)lines.push(['Prev extra',h.prevExtra]);
  const total=Math.round(lines.reduce((a,l)=>a+l[1],0));
  S.bills[id]={lines,total,calc,tenant:h.tenant||h.code,code:h.code,month:S.collMonth};
  h.status='due';go('bill',id);}

/* ================= BILL (Hasnain's template + breakdown) ================= */
function vBill(id){const b=S.bills[id];if(!b)return shell('<p>No bill yet</p>');
  const txt=`${b.tenant} ${b.code}\n\n`+b.lines.map(l=>`${l[0]} ${l[1]}`).join('\n')+`\n\nTotal ${b.total}`;
  return `${sheetBar('Bill · '+b.code)}<div class="body">
  <div class="bill"><h3>${esc(b.tenant)} ${esc(b.code)}</h3>
  ${b.lines.map(l=>`<div class="bl"><span>${esc(l[0])}</span><span>${l[1]}</span></div>`).join('')}
  <div class="bl tot"><span>Total</span><span>${b.total}</span></div></div>
  <div class="calc"><b>How this was calculated (saved property rules applied):</b><br>${b.calc.join('<br>')||'No variable splits this month.'}</div>
  <div class="row"><button class="btn btn2 grow" onclick="toast('Opening WhatsApp with bill text (demo)')">📲 WhatsApp</button>
  <button class="btn btn2 grow" onclick="toast('Bill PDF saved (demo)')">📄 PDF</button></div>
  <button class="btn" onclick="H('${id}').status='paid';toast('Marked paid');tab('coll')">✓ Mark paid</button>
  <button class="btn btn2" onclick="go('sheet','${id}')">← Back to sheet</button></div>`;
}
</script>

<script>
/* ================= COLLECTION (rows are clickable) ================= */
function lastMonths(n){const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const out=[];const d=new Date();for(let i=0;i<n;i++){out.push(m[d.getMonth()]+' '+d.getFullYear());d.setMonth(d.getMonth()-1);}return out;}
const MONTHS=lastMonths(12);
function pastForm(){$('addrec').innerHTML=`<div class="card"><b>＋ Add past record</b><div class="mut">Enter old-month data for any house.</div>
  <label>House</label><select id="pr_house">${S.houses.map(h=>`<option value="${h.id}">${esc(h.code)} — ${esc(h.tenant||'vacant')}</option>`).join('')}</select>
  <label>Month</label><select id="pr_month">${MONTHS.map(m=>`<option ${m===S.collMonth?'selected':''}>${m}</option>`).join('')}</select>
  <label>Amount (Rs)</label><input id="pr_amt" type="number" inputmode="numeric" placeholder="e.g. 12000">
  <label>Status</label><div class="seg" id="pr_st"><button class="on" onclick="prStatus('paid')">Paid</button><button onclick="prStatus('due')">Due</button></div>
  <div class="row"><button class="btn btn2 grow" onclick="$('addrec').innerHTML=''">Cancel</button><button class="btn grow" onclick="addPast()">Save</button></div></div>`;S._prSt='paid';}
function prStatus(s){S._prSt=s;const b=$('pr_st').children;b[0].className=s==='paid'?'on':'';b[1].className=s==='due'?'on':'';}
function addPast(){const hid=$('pr_house').value,m=$('pr_month').value,a=+$('pr_amt').value||0;
  S.past=S.past.filter(r=>!(r.houseId===hid&&r.month===m));
  S.past.push({id:'p'+Date.now(),houseId:hid,month:m,amount:a,status:S._prSt||'paid'});
  toast('Past record saved for '+m);render();}
function vColl(){
  if(!S.prop) return shell(`<div class="empty"><div style="font-size:52px">🧾</div><p>Register a property first.</p><button class="btn" onclick="startWz()">＋ ${T('reg')}</button></div>`);
  const rec=h=>{const b=S.bills[h.id];if(b&&b.month===S.collMonth)return{amount:b.total,status:h.status,src:'bill'};
    const r=S.past.find(r=>r.houseId===h.id&&r.month===S.collMonth);if(r)return{amount:r.amount,status:r.status,src:'past'};
    return{amount:h.rent||0,status:h.status,src:'rent'};};
  const amt=h=>rec(h).amount;
  const exp=S.houses.reduce((a,h)=>a+amt(h),0);
  const col=S.houses.filter(h=>rec(h).status==='paid').reduce((a,h)=>a+amt(h),0);
  const pct=exp>0?Math.round(col/exp*100):0;
  const tabs=`<div class="tabrow"><button class="${S.collTab==='bld'?'on':''}" onclick="S.collTab='bld';render()">Building-wise</button><button class="${S.collTab==='house'?'on':''}" onclick="S.collTab='house';render()">House-wise</button></div>`;
  const msel=`<label>Month</label><select onchange="S.collMonth=this.value;render()">${MONTHS.map(m=>`<option ${S.collMonth===m?'selected':''}>${m}</option>`).join('')}</select>`;
  let body='';
  if(S.collTab==='bld'){
    body=`<div class="hrow" onclick="tab('houses')"><div class="dp">🏢</div><div class="grow"><b>${esc(S.prop.name)}</b>
    <div class="mut">Expected Rs ${exp} · Collected Rs ${col} · Pending Rs ${exp-col}</div>
    <div style="background:#2b3a55;border-radius:6px;height:8px;margin-top:6px"><div style="width:${pct}%;background:var(--acc);height:8px;border-radius:6px"></div></div></div>
    <b>${pct}%</b></div><div class="mut">Tap a building to open its houses →</div>`;
  }else{
    body=S.houses.map(h=>{const r=rec(h);return `<div class="hrow" onclick="go('sheet','${h.id}')">
    <div class="dp">${esc((h.tenant||h.code)[0].toUpperCase())}</div>
    <div class="grow"><b>${esc(h.tenant||'(vacant)')}</b><div class="mut">${esc(S.prop.name)} · ${esc(h.code)}${r.src==='past'?' · past record':''}</div></div>
    <div style="text-align:right"><b>Rs ${r.amount||'—'}</b><br><span class="st ${r.status==='paid'?'paid':'due'}">${r.status==='paid'?'Paid':'Due'}</span></div></div>`;}).join('')
    +`<div class="mut">Tap a house to open its monthly sheet →</div>`;
  }
  return shell(`<h2 class="stitle">Collection</h2>${msel}<div style="height:8px"></div>${tabs}${body}
  <div id="addrec"></div><button class="btn btn2" onclick="pastForm()">＋ Add past record (old months)</button>`);
}

/* ================= SETTINGS (everything works) ================= */
function vSet(){
  return shell(`<h2 class="stitle">${T('set')}</h2>
  <div class="card"><b>🎨 Appearance</b><div class="seg">
    <button class="${S.theme==='dark'?'on':''}" onclick="S.theme='dark';render()">🌙 Dark</button>
    <button class="${S.theme==='light'?'on':''}" onclick="S.theme='light';render()">☀️ Light</button></div></div>
  <div class="card"><b>🌐 Language</b><div class="seg">
    <button class="${S.lang==='en'?'on':''}" onclick="S.lang='en';render()">English</button>
    <button class="${S.lang==='ur'?'on':''}" onclick="S.lang='ur';render()">اردو</button></div>
    <div class="mut">Switches the app's main labels.</div></div>
  <div class="card"><b>☁️ Sync</b><div class="mut">Last synced: ${S.lastSync||'never'}</div>
    <button class="btn btn2" onclick="S.lastSync=new Date().toLocaleString();toast('Synced just now');render()">🔄 Sync now</button></div>
  <div class="card"><b>💾 Data</b>
    <button class="btn btn2" onclick="toast('Import runs in the full app (demo)')">📥 Import app data</button>
    <button class="btn btn2" onclick="toast('Backup saved (demo)')">📤 Export / backup</button></div>
  <div class="card"><b>📱 App</b>
    <button class="btn btn2" onclick="toast('You have the latest version (demo)')">⬆️ Check for update</button>
    <div class="kv" style="margin-top:8px"><span>Version</span><b>3.0 prototype v2</b></div></div>`);
}

/* ================= ROUTER ================= */
function render(){const a=$('app');const sc=S.screen;const y=window.scrollY;
  if(sc==='login')a.innerHTML=vLogin();
  else if(sc==='signup')a.innerHTML=vSignup();
  else if(sc==='wizard')a.innerHTML=vWizard();
  else if(sc==='sheet')a.innerHTML=vSheet(S._p);
  else if(sc==='bill')a.innerHTML=vBill(S._p);
  else{if(S.tab==='home')a.innerHTML=vHome();else if(S.tab==='houses')a.innerHTML=vHouses();else if(S.tab==='coll')a.innerHTML=vColl();else a.innerHTML=vSet();}
  document.body.classList.toggle('light',S.theme==='light');
  window.scrollTo(0,y);
}
render();
</script>
</body>
</html>
